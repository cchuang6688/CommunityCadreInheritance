<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>社長不慌｜松山社團幹部傳承指南與工具箱</title>
<style>
:root{--g:#0B4F37;--g2:#0e6445;--w:#F8F9FA;--y:#F2B824;--ink:#1d2a24;--mut:#5b6b63;--line:#dfe6e2;--card:#fff}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--w);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.75;font-size:17px}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
nav{background:var(--g);position:sticky;top:0;z-index:5}
nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.logo{color:#fff;font-weight:800;font-size:20px;letter-spacing:.05em}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:0;background:transparent;color:#d8eadf;font:inherit;font-size:15px;padding:8px 14px;border-radius:999px;cursor:pointer}
.tab[aria-selected=true]{background:var(--y);color:var(--g);font-weight:700}
.tab:hover:not([aria-selected=true]){background:rgba(255,255,255,.12)}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
header.hero{background:var(--g);color:#fff;padding:44px 0 56px}
.hero h1{font-size:clamp(38px,8vw,64px);margin:0;line-height:1.15;letter-spacing:.08em}
.hero .sub{font-size:clamp(17px,3vw,22px);margin:10px 0 0;color:#cfe5d8}
.hero .slogan{display:inline-block;margin-top:22px;background:var(--y);color:var(--g);font-weight:800;padding:8px 18px;border-radius:12px;font-size:18px}
main{margin-top:-28px;padding-bottom:50px}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;margin-bottom:18px;box-shadow:0 2px 10px rgba(11,79,55,.06)}
h2{color:var(--g);margin:0 0 4px;font-size:26px}
h3{color:var(--g);margin:0 0 8px;font-size:19px}
.lead{color:var(--mut);margin:0 0 18px}
.tag{display:inline-block;background:var(--y);color:var(--g);font-size:13px;font-weight:700;padding:1px 10px;border-radius:999px;margin-right:6px}
.btn{display:block;width:100%;border:0;background:var(--y);color:var(--g);font:inherit;font-weight:800;font-size:19px;padding:15px 22px;border-radius:14px;cursor:pointer;transition:transform .1s}
.btn:hover{filter:brightness(.96)}.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;border:2px solid var(--g);color:var(--g);font-size:16px;padding:10px 18px;width:auto;display:inline-block}
/* progress */
.bar{height:22px;background:#e6ede9;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--g);transition:width .35s;border-radius:999px}
.pct{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.pct b{font-size:38px;color:var(--g);line-height:1}
.msg{margin-top:10px;color:var(--mut);font-weight:600}
.chk{display:flex;gap:14px;align-items:flex-start;padding:14px;border:2px solid var(--line);border-radius:14px;margin-bottom:10px;cursor:pointer;background:#fff}
.chk:has(input:checked){border-color:var(--g);background:#eef6f1}
.chk input{width:26px;height:26px;accent-color:var(--g);flex:none;margin-top:2px}
.chk b{display:block}.chk small{color:var(--mut)}
.chk:has(input:checked) b{text-decoration:line-through;text-decoration-color:var(--y);text-decoration-thickness:3px}
.roles{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.role{border:2px solid var(--g);background:#fff;color:var(--g);font:inherit;font-weight:700;padding:9px 18px;border-radius:999px;cursor:pointer}
.role[aria-pressed=true]{background:var(--g);color:#fff}
.note h4{margin:14px 0 4px;color:var(--g)}
.note ul{margin:0;padding-left:22px}
details{border:1px solid var(--line);border-radius:14px;padding:4px 16px;margin-bottom:10px;background:#fff}
summary{cursor:pointer;font-weight:700;padding:10px 0;color:var(--g)}
/* evaluator */
.name{width:100%;font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:12px;margin-bottom:16px}
.sk{padding:14px 0;border-top:1px dashed var(--line)}
.sk .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sk output{font-weight:800;color:var(--g);white-space:nowrap}
.sk small{color:var(--mut)}
input[type=range]{width:100%;accent-color:var(--g);height:34px}
.res{display:none;margin-top:20px}
.top{background:var(--g);color:#fff;border-radius:18px;padding:22px}
.top h3{color:var(--y);font-size:15px;margin:0}
.top .big{font-size:34px;font-weight:800;margin:2px 0 6px}
.rk{display:grid;grid-template-columns:64px 1fr 48px;gap:10px;align-items:center;margin:10px 0}
.rk .bar{height:14px}
.rk .bar i{background:var(--y)}
.top .bar{background:rgba(255,255,255,.2)}
.hint{background:#fff8e1;border-left:6px solid var(--y);padding:12px 16px;border-radius:10px;margin-top:14px;color:#4a3b05}
/* Q&A */
.q{margin-bottom:22px}
.bub{max-width:88%;padding:14px 18px;border-radius:20px;margin-bottom:8px;display:block}
.bub.me{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px;font-weight:700;cursor:pointer;text-align:left;font:inherit;font-weight:700;width:auto}
.bub.sr{background:var(--g);color:#fff;border-bottom-right-radius:4px;margin-left:auto;display:none}
.q.open .bub.sr{display:block}
.bub.sr ul{margin:6px 0 0;padding-left:20px}
.bub .who{font-size:13px;color:var(--y);font-weight:700;display:block;margin-bottom:2px}
.bub.me::after{content:"　點我看學長姐怎麼說 ▾";color:var(--mut);font-weight:400;font-size:14px}
.q.open .bub.me::after{content:" ▴";}
footer{text-align:center;color:var(--mut);padding:30px 20px;font-size:14px}
@media(max-width:600px){body{font-size:16px}.card{padding:18px;border-radius:16px}.bub{max-width:96%}.rk{grid-template-columns:54px 1fr 42px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<nav><div class="wrap">
  <span class="logo">社長不慌</span>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-t="sop" aria-selected="true">交接檢核表</button>
    <button class="tab" role="tab" data-t="eval" aria-selected="false">能力評估器</button>
    <button class="tab" role="tab" data-t="qa" aria-selected="false">避坑指南</button>
  </div>
</div></nav>

<header class="hero"><div class="wrap">
  <h1>社長不慌</h1>
  <p class="sub">松山社團幹部傳承指南與工具箱</p>
  <span class="slogan">幹部神隊友，經驗全保留。</span>
</div></header>

<main class="wrap">

<!-- 1 SOP -->
<section id="sop" class="panel on">
  <div class="card">
    <h2>幹部交接 SOP 檢核表</h2>
    <p class="lead">交接完一項就勾一項，進度會自動記在這台裝置上。</p>
    <div class="pct"><span>目前交接進度</span><b id="pv">0%</b></div>
    <div class="bar"><i id="pb"></i></div>
    <p class="msg" id="pm">還沒開始，先從第一項勾起吧！</p>
  </div>
  <div class="card" id="list"></div>
  <div class="card note">
    <h2>各職位注意事項與實施要點</h2>
    <p class="lead">選擇職位，查看該職務交接時要特別注意什麼。</p>
    <div class="roles" id="roles"></div>
    <div id="rolebox"></div>
  </div>
</section>

<!-- 2 Evaluator -->
<section id="eval" class="panel">
  <div class="card">
    <h2>幹部能力與分工量化評估器</h2>
    <p class="lead">為候選人的 5 項能力打分（1＝需要加強，5＝非常擅長），系統會算出最適合的職位。分數請以「實際合作經驗」為準，不要憑印象。</p>
    <input class="name" id="who" placeholder="候選人名字（可不填）" maxlength="12">
    <div id="sks"></div>
    <button class="btn" id="go" style="margin-top:12px">計算最適合的職位</button>
    <div class="res" id="res"></div>
  </div>
</section>

<!-- 3 QA -->
<section id="qa" class="panel">
  <div class="card">
    <h2>學長姐避坑指南</h2>
    <p class="lead">這些狀況，學長姐都遇過。點開問題看解法。</p>
  </div>
  <div class="card" id="qlist"></div>
</section>
</main>
<footer>社長不慌｜幹部神隊友，經驗全保留。<br>本站內容為通用建議，實際規定請以學校社團組公告為準。</footer>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
/* tabs */
function show(t){$$('.panel').forEach(p=>p.classList.toggle('on',p.id===t));$$('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));scrollTo({top:0})}
$$('.tab').forEach(b=>b.onclick=()=>show(b.dataset.t));

/* 1. SOP */
const items=[
 ["社團印章與存摺點交","現場清點印章、存摺、提款卡（如有），並簽收登記，不要口頭交付。"],
 ["社團組行政規定確認","向社團組確認申請流程、截止日、場地與經費規範，並請學長姐補充實際踩過的雷。"],
 ["活動企劃書範本交接","取得上學年企劃書、核銷單、成果報告範本，並標註哪些欄位最常被退件。"],
 ["器材清單盤點","對照清單逐項清點、拍照存證，損壞或遺失的當場記錄。"],
 ["年度行事曆對接","對接已確定的活動、期限與固定合作對象，標出本學期第一個死線。"]
];
const KEY='sbh-sop';let done=[];
try{done=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
$('#list').innerHTML='<h3>交接項目</h3>'+items.map((it,i)=>`<label class="chk"><input type="checkbox" data-i="${i}" ${done.includes(i)?'checked':''}><span><b>${it[0]}</b><small>${it[1]}</small></span></label>`).join('')+'<button class="btn ghost" id="rst">全部重置</button>';
function upd(){
  const c=$$('#list input:checked'),n=Math.round(c.length/items.length*100);
  $('#pv').textContent=n+'%';$('#pb').style.width=n+'%';
  $('#pm').textContent=n==0?'還沒開始，先從第一項勾起吧！':n<50?'好的開始，繼續保持！':n<100?'過半了，剩下的別拖！':'全部完成！交接沒有遺漏，可以放心上任。';
  try{localStorage.setItem(KEY,JSON.stringify(c.map(x=>+x.dataset.i)))}catch(e){}
}
$$('#list input').forEach(x=>x.onchange=upd);
$('#rst').onclick=()=>{$$('#list input').forEach(x=>x.checked=false);upd()};
upd();

const R={
"社長":{n:["要對所有決定負最後責任，但不用每件事自己做。","重大事項（經費、場地、對外）要與社團組、指導老師保持同步。"],p:["每週固定開一次幹部會議，30 分鐘內結束。","建立共用雲端資料夾，所有文件集中管理。","任期中期安排一次檢討，提前找接班人。"]},
"活動":{n:["企劃書要早交，場地與器材常常需要提前申請。","活動前一週一定要做彩排或流程走查。"],p:["使用上學年企劃書範本，重新檢查日期與預算。","列出「活動前、中、後」分工表與負責人。","備妥雨天或人數不足的備案。"]},
"美宣":{n:["海報、貼文若涉及圖片或字體，要確認有使用授權。","宣傳要在活動前 7～10 天開始，不要最後才趕。"],p:["向學長姐要原始檔與常用素材，整理成資料夾。","建立社團固定視覺（色彩、字體、Logo 用法）。","發布前請另一位幹部校對日期與地點。"]},
"總務":{n:["款項來去都要有單據，核銷期限一定要記住。","印章與存摺由不同人保管較安全。"],p:["建立收支表，每筆支出當天登記。","核銷憑證拍照備份，並依活動分袋存放。","每月與社長對帳一次，月底結算。"]},
"公關":{n:["對外聯絡要使用社團正式名義，並留下紀錄。","與店家、講師或他校的往來，要經社長確認再承諾。"],p:["整理合作對象通訊錄，註明上次合作狀況。","寫一份標準邀約信與感謝信範本。","活動後 3 天內寄出感謝，維持長期關係。"]}};
const rb=$('#roles');
Object.keys(R).forEach((k,i)=>{const b=document.createElement('button');b.className='role';b.textContent=k;b.setAttribute('aria-pressed',i==0);b.onclick=()=>pick(k);rb.appendChild(b)});
function pick(k){
  $$('.role').forEach(b=>b.setAttribute('aria-pressed',b.textContent===k));
  const r=R[k];
  $('#rolebox').innerHTML=`<details open><summary>${k}｜注意事項</summary><ul>${r.n.map(x=>`<li>${x}</li>`).join('')}</ul></details><details open><summary>${k}｜實施要點</summary><ul>${r.p.map(x=>`<li>${x}</li>`).join('')}</ul></details>`;
}
pick('社長');

/* 2. Evaluator */
const S=[
 {id:'comm',n:'溝通協調',d:'能聽懂不同意見，並促成共識'},
 {id:'acct',n:'細心管帳',d:'對數字敏感，不漏單據、不算錯'},
 {id:'idea',n:'創意發想',d:'常有新點子，會做設計或活動巧思'},
 {id:'doc',n:'文書處理',d:'能寫企劃、公文、紀錄，格式清楚'},
 {id:'crisis',n:'危機處理',d:'突發狀況時能冷靜判斷、快速應變'}
];
const W={
 "社長":{comm:.3,crisis:.3,doc:.15,idea:.15,acct:.1},
 "活動":{comm:.25,idea:.25,crisis:.2,doc:.2,acct:.1},
 "美宣":{idea:.6,doc:.15,comm:.15,crisis:.05,acct:.05},
 "總務":{acct:.5,doc:.25,comm:.15,crisis:.1,idea:0},
 "公關":{comm:.5,idea:.2,crisis:.15,doc:.1,acct:.05}
};
const lv=['','需要加強','普通','還不錯','很擅長','非常突出'];
$('#sks').innerHTML=S.map(s=>`<div class="sk"><div class="row"><b>${s.n}</b><output id="o-${s.id}">3 分・${lv[3]}</output></div><small>${s.d}</small><input type="range" min="1" max="5" value="3" id="${s.id}"></div>`).join('');
S.forEach(s=>$('#'+s.id).oninput=e=>$('#o-'+s.id).textContent=e.target.value+' 分・'+lv[e.target.value]);
$('#go').onclick=()=>{
  const v={};S.forEach(s=>v[s.id]=+$('#'+s.id).value);
  const nm=($('#who').value.trim())||'這位候選人';
  const sc=Object.keys(W).map(r=>{
    const raw=Object.entries(W[r]).reduce((a,[k,w])=>a+w*v[k],0);
    const parts=Object.entries(W[r]).filter(([k,w])=>w>=.15).map(([k,w])=>({k,s:w*v[k],v:v[k]})).sort((a,b)=>b.s-a.s);
    return{r,p:Math.round(raw/5*100),parts}
  }).sort((a,b)=>b.p-a.p);
  const t=sc[0],nameOf=id=>S.find(s=>s.id===id).n;
  const why=t.parts.slice(0,2).map(x=>`${nameOf(x.k)}（${x.v} 分）`).join('、');
  const weak=Object.entries(W[t.r]).filter(([k,w])=>w>=.2&&v[k]<=2).map(([k])=>nameOf(k));
  const gap=t.p-sc[1].p;
  $('#res').style.display='block';
  $('#res').innerHTML=`<div class="top"><h3>推薦職位</h3><div class="big">${nm}：${t.r}　${t.p} 分</div>
  <p style="margin:0">原因：${t.r}職務最看重的能力中，${nm}在${why}表現最好，與職務需求高度吻合。</p>
  ${sc.map(x=>`<div class="rk"><span>${x.r}</span><div class="bar"><i style="width:${x.p}%"></i></div><b>${x.p}</b></div>`).join('')}</div>
  <div class="hint"><span class="tag">提醒</span>${gap<=5?`第二名「${sc[1].r}」只差 ${gap} 分，可以與本人談談意願再決定。`:`領先第二名「${sc[1].r}」${gap} 分，適配度明確。`}${weak.length?`<br>要注意：${t.r}也需要「${weak.join('、')}」，建議安排學長姐或搭檔幹部互補。`:''}<br>評分僅供參考，也請尊重本人的興趣與意願。</div>`;
  $('#res').scrollIntoView({behavior:'smooth',block:'nearest'});
};

/* 3. Q&A */
const Q=[
 ["沒有人要接幹部，壓力很大怎麼辦？",["先拆解：不是「沒人要」，通常是「不知道要做什麼」。把每個職位的工作內容寫成一頁說明。","降低門檻：開放「副幹部」或「見習幹部」，先參與一學期再接棒。","找人時要具體：與其說「誰來當社長」，不如問「你願意負責美宣嗎？」。","必要時調整規模：減少活動數量，讓幹部負擔變輕，也比較容易招到人。"]],
 ["遇到學長姐也沒遇過的行政問題怎麼辦？",["先找社團組老師，說明狀況並詢問正確流程，不要自己猜。","查其他社團的做法，或詢問更早幾屆的畢業學長姐。","處理完把過程寫進交接文件，下一屆就不會再卡關。","不確定的事先不要對外承諾，確認之後再回覆。"]],
 ["動態與靜態社團，要如何參考他社的公開資料？",["可以參考：活動成果、公開的活動企劃流程、社團介紹與招生方式。","動態社團（如康輔、體育）可參考他社的活動動線與安全規劃。","靜態社團（如研究、學術）可參考社課設計與成果發表形式。","注意：取用他人素材要註明出處，內部資料與個資不要擅自轉載。"]],
 ["新舊幹部意見不合，要聽誰的？",["先確認目的：舊做法是否有原因？可以請學長姐說明當年的考量。","新想法可以小規模試辦，用結果決定是否採用。","最後仍由當任幹部做決定，但要記錄理由。"]],
 ["活動前一週才發現器材或場地有問題？",["先確認替代方案：向社團組詢問可借用的場地或器材。","立即通知相關人員（講師、參加者），說明調整內容。","事後要記入交接文件，並在行事曆提醒下一屆提早確認。"]],
 ["交接文件太多，怎麼整理才有人看？",["用「一頁總覽」放在最前面：誰負責什麼、重要期限、聯絡人。","檔案名稱統一，如「2026_活動_企劃書_範本」。","每學期結束前，各職位各自更新一次。"]]
];
$('#qlist').innerHTML=Q.map((q,i)=>`<div class="q"><button class="bub me" aria-expanded="false"><span class="who">新任幹部</span>${q[0]}</button><div class="bub sr"><span class="who">學長姐說</span><ul>${q[1].map(x=>`<li>${x}</li>`).join('')}</ul></div></div>`).join('');
$$('.q .me').forEach(b=>b.onclick=()=>{const q=b.parentElement;q.classList.toggle('open');b.setAttribute('aria-expanded',q.classList.contains('open'))});
</script>
</body>
</html>
